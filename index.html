  --bg:#0b4f4a; --bg2:#0a4944; --panel:#062f2c; --soft:#0d6058;
  --edge:#eaf2f1; --ink:#ffffff; --muted:#a9d1cc;
  --accent:#f59e0b; --accent-ink:#2b1a00; --label:#fcd34d; --stage:#a9d1cc;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh;
  font-family:'Handjet','Courier New',monospace; font-weight:500; font-size:25px; line-height:1.25; color:var(--ink);
  background:conic-gradient(var(--bg) 25%, var(--bg2) 0 50%, var(--bg) 0 75%, var(--bg2) 0) 0 0/16px 16px;
}
.app{max-width:480px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
.pf{font-family:'Press Start 2P','Courier New',monospace; font-weight:400; line-height:1.6}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
:focus-visible{outline:4px solid var(--accent); outline-offset:4px}
h1[tabindex="-1"]:focus{outline:none}

/* пиксельная рамка: ступенчатые углы через box-shadow */
.win{
  background:var(--panel); margin:4px 4px 18px; padding:16px;
  box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge);
}
.btn{
  display:block; width:calc(100% - 8px); margin:10px 4px 18px; padding:14px 16px; text-align:left;
  font:inherit; font-weight:500; color:var(--ink); background:var(--soft); border:0; cursor:pointer; border-radius:0;
  box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset 0 -4px 0 0 rgba(0,0,0,.28);
}
.btn,.dialog{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.btn{scroll-margin-bottom:20px}
.win{scroll-margin-top:10px}
.btn:active{transform:translateY(3px)}
.btn.primary{background:var(--accent); color:var(--accent-ink); font-weight:700}
.btn.ghost{background:transparent}
.btn b{display:block; font-weight:700; font-size:29px; line-height:1.1}
.btn small{display:block; margin-top:4px; font-size:22px; color:var(--muted); line-height:1.15}
.btn.primary small{color:var(--accent-ink)}
.btn.seen{opacity:.72}
.btn.back{display:inline-block; width:auto; min-height:48px; margin:4px 4px 22px; padding:8px 16px; font-size:24px}
.tag{display:inline-block; margin-bottom:8px; padding:0 8px; font-size:21px; font-weight:700; color:var(--accent-ink); background:var(--label)}

.title{font-family:'Press Start 2P','Courier New',monospace; font-weight:400; font-size:17px; line-height:1.6; margin:6px 0 16px}
.home-title{font-size:24px}
.lead{color:var(--muted); margin-bottom:20px; font-size:25px}
.center{text-align:center}
.coin-wrap{display:flex; justify-content:center; margin:8px 0 22px}
canvas{image-rendering:pixelated; image-rendering:crisp-edges; display:block}
.tagline{text-wrap:balance; margin-top:30px; color:var(--muted); text-align:center; font-size:24px}

/* теория */
.t-title{font-weight:700; font-size:38px; line-height:1.05; margin:4px 4px 8px}
.t-author{color:var(--label); margin:0 4px 20px; font-size:26px}
.prose p{margin-bottom:14px}
.note{margin:20px 4px 22px; padding:14px 16px; background:var(--soft); box-shadow:0 -4px 0 0 var(--accent), 0 4px 0 0 var(--accent), -4px 0 0 0 var(--accent), 4px 0 0 0 var(--accent)}
.note .lbl{color:var(--label); font-weight:700; margin-bottom:4px; font-size:28px}
.src{color:var(--muted); font-size:21px; margin:0 4px 24px; line-height:1.2}

/* игра */
.stage{
  background:var(--stage); margin:4px 4px 22px; padding:14px 0 10px; display:flex; justify-content:center;
  box-shadow:0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge);
}
.dialog{position:relative; margin-top:34px; cursor:pointer; min-height:118px}
.name{
  position:absolute; top:-26px; left:-4px; padding:6px 10px 4px; font-size:12px; color:var(--accent-ink); background:var(--label);
}
.line{font-size:29px; line-height:1.2; min-height:84px; padding-bottom:26px; white-space:pre-wrap}
.hint{position:absolute; right:12px; bottom:8px; width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent; border-top:10px solid var(--accent); animation:blink 1s steps(2) infinite}
.dialog.done .hint{display:block} .dialog:not(.done) .hint{display:none}
@keyframes blink{50%{opacity:0}}
.q{font-weight:700; font-size:32px; margin:0 4px 6px}
.result .lbl{color:var(--label); font-weight:700; margin-bottom:2px; font-size:30px}
.result p{margin-bottom:14px}
.result p:last-child{margin-bottom:0}
.reflect{margin:0 4px 6px; color:var(--muted); font-size:25px}
@media (prefers-reduced-motion:reduce){ .hint{animation:none} .btn:active{transform:none} }
@media (min-width:520px){ .app{padding-top:40px} }
@media (max-height:700px){ .stage{padding:8px 0 4px; margin-bottom:18px} .stage canvas{width:96px!important; height:96px!important} .btn.back{margin-bottom:12px} }

const PAL = { ".":null, h:"#3b2414", n:"#7c4a21", s:"#f3c9a5", S:"#d49a76", e:"#10241f", k:"#10241f",
  o:"#f59e0b", O:"#b45309", t:"#0f766e", T:"#0b4f4a", w:"#ffffff", g:"#9aa7ad", G:"#4b5963",

const R=(l,c)=>".".repeat(l)+c+".".repeat(16-l-c.length);
const put=(rows,r,c,ch)=>{ rows[r]=rows[r].slice(0,c)+ch+rows[r].slice(c+1); };
function bust(hair,hood,trim){
  const s="s", x=(n,ch)=>ch.repeat(n);
  return [
    R(0,""), R(5,x(6,hair)), R(4,x(8,hair)), R(3,x(10,hair)),
    R(3,hair+hair+x(6,s)+hair+hair), R(3,hair+x(8,s)+hair),
    R(3,hair+s+"e"+x(4,s)+"e"+s+hair), R(3,hair+x(8,s)+hair),
    R(4,x(3,s)+"SS"+x(3,s)), R(5,x(6,s)), R(6,x(4,s)),
    R(2,x(12,hood)), R(1,x(14,hood)), R(1,x(6,hood)+x(2,trim)+x(6,hood)), R(1,x(14,hood)), R(1,x(14,hood))
  ];
}

    R(0,""), R(6,"wwww"), R(5,"wwwwww"), R(5,"wwwwww"), R(6,"wwww"),
    R(5,"BbbbbB"), R(6,"BbbB"), R(6,"BbbB"), R(4,"BbbbbbbB"),
    R(3,"Bbbbbbbbbb".slice(0,9)+"B"), R(3,"Bbbbyybbb"+"B"), R(3,"Bbbyooybb"+"B"),
    R(3,"Bbbbyybbb"+"B"), R(3,"Bbbbbbbbb"+"B"), R(3,"B".repeat(10)), R(0,"")
  ]; },
  coin(){
    const r=[]; for(let y=0;y<16;y++){ let row=""; for(let x=0;x<16;x++){
      const d=Math.hypot(x-7.5,y-7.5); row+= d>7.4?".": d>6.2?"T": d>5.2?"O":"o"; } r.push(row); }
    ["..ttt..","t.....t",".....t.","....t..","...t...",".......","...t..."].forEach((g,i)=>{
      for(let c=0;c<7;c++) if(g[c]==="t") put(r,4+i,5+c-1,"T"); });
    return r; }
};
function drawSprite(name,scale){
  const rows=SPRITES[name](), cv=document.createElement("canvas");
  cv.width=16; cv.height=16; cv.style.width=cv.style.height=(16*scale)+"px"; cv.setAttribute("aria-hidden","true");
  const ctx=cv.getContext("2d");
  rows.forEach((row,y)=>{ for(let x=0;x<16;x++){ const c=PAL[row[x]]; if(c){ ctx.fillStyle=c; ctx.fillRect(x,y,1,1);} } });
  return cv;
}

/* ============ Помощники ============ */
const $app=document.getElementById("app"), $live=document.getElementById("live");
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
const el=(tag,cls,html)=>{ const n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; };
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function btn(html,cls,on){ const b=el("button","btn "+(cls||""),html); b.type="button"; b.addEventListener("click",on); return b; }
const go=h=>{ location.hash=h; };
function mount(nodes,focusSel){
  clearTimeout(typeTimer); $app.replaceChildren(...nodes); window.scrollTo(0,0);
  const f=focusSel&&$app.querySelector(focusSel); if(f){ f.setAttribute("tabindex","-1"); f.focus({preventScroll:true}); }
}

/* ============ Экраны ============ */
function home(){
  const wrap=el("div","coin-wrap"); wrap.append(drawSprite("coin",10));
  const head=el("div","center"); head.append(el("h1","title home-title","Цена<br>знания"));
  const intro=el("div","win",""); intro.textContent="Шесть коротких идей из теории и четыре педагогические ситуации.";
  mount([wrap,head,intro,
    btn("<b>Читать теорию</b><small>Леонтьев и Уиллингем: что стоит за вопросом «зачем нам это?»</small>","primary",()=>go("#/theory")),
    btn("<b>Играть в ситуации</b><small>Четыре случая из школьной практики</small>","",()=>go("#/situations")),
    el("p","tagline","Сегодня вы заплатили временем и вниманием. Заберите с собой взамен новый опыт.")],"h1");
}
function theoryList(){
  const nodes=[ btn("Назад","back ghost",()=>go("#/")), el("h1","title","Теория"),
    el("p","lead","Две опоры: психолог А. Н. Леонтьев (теория деятельности) и когнитивист Д. Уиллингем.") ];
  THEORY.forEach(t=>nodes.push(btn(`<b>${esc(t.title)}</b><small>${esc(t.author)}</small>`,"",()=>go("#/theory/"+t.id))));
  mount(nodes,"h1");
}
function theoryCard(id){
  const t=THEORY.find(x=>x.id===id); if(!t) return go("#/theory");
  const prose=el("div","prose"); t.body.forEach(p=>prose.append(el("p",null,esc(p))));
  const note=el("div","note",`<div class="lbl">${esc(t.note.label)}</div><div>${esc(t.note.text)}</div>`);
  const nodes=[ btn("К теории","back ghost",()=>go("#/theory")),
    el("h1","t-title",esc(t.title)), el("p","t-author",esc(t.author)), prose, note, el("p","src",esc(t.source)) ];
  const sit=SITUATIONS.find(s=>s.id===t.play);
  if(sit) nodes.push(btn(`<b>Проверить на ситуации</b><small>${esc(sit.title)}</small>`,"primary",()=>go("#/play/"+sit.id)));
  mount(nodes,"h1");
}
function situationList(){
  const nodes=[ btn("Назад","back ghost",()=>go("#/")), el("h1","title","Ситуации"),
    el("p","lead","Выберите ситуацию и примите решение. Правильных ответов здесь нет, есть последствия.") ];
  SITUATIONS.forEach(s=>nodes.push(btn(""+`<b>${esc(s.title)}</b><small>${esc(s.teaser)}</small>`,"",()=>go("#/play/"+s.id))));
  mount(nodes,"h1");
}

/* ============ Игра ============ */
let typeTimer=null, finishTyping=null;
function typeInto(node,full,done){
  clearTimeout(typeTimer); let i=0; node.textContent="";
  const end=()=>{ clearTimeout(typeTimer); node.textContent=full; finishTyping=null; node.parentElement.classList.add("done"); done&&done(); };
  node.parentElement.classList.remove("done");
  if(reduceMotion){ end(); return; }
  finishTyping=end;
  (function tick(){ i+=2; node.textContent=full.slice(0,i); if(i>=full.length) end(); else typeTimer=setTimeout(tick,18); })();
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function play(id){
  const sit=SITUATIONS.find(s=>s.id===id); if(!sit) return go("#/situations");
  const st={beat:0, order:shuffle([0,1,2]), pick:null, seen:new Set()};
  const stage=el("div","stage"), dialog=el("div","dialog"), name=el("div","name pf"), line=el("p","line"), hint=el("span","hint");
  dialog.append(name,line,hint);
  const dwin=el("div","win"); dwin.append(dialog);
  const actions=el("div","actions");
  const head=el("h1","sr",esc(sit.title));
  mount([ btn("К ситуациям","back ghost",()=>go("#/situations")), head, stage, dwin, actions ],"h1");
  dwin.addEventListener("click",()=>{ if(finishTyping) finishTyping(); });

  const setSprite=n=>stage.replaceChildren(drawSprite(n,8));
  const say=(who,text,sprite,done)=>{ name.textContent=who; setSprite(sprite); $live.textContent=who+": "+text; typeInto(line,text,done); };
  const next=label=>btn(label||"Дальше","primary",()=>{ st.beat++; show(); });
  const reveal=mode=>requestAnimationFrame(()=>{
    const target=mode==="btn"?actions.firstElementChild:dwin; if(!target) return;
    target.scrollIntoView({block:mode==="btn"?"nearest":"start", behavior:reduceMotion?"auto":"smooth"}); });

  function show(){
    actions.replaceChildren(); window.scrollTo(0,0);
    if(st.beat===0){ say("Сцена",sit.scene,sit.sprite,()=>{ actions.replaceChildren(next()); reveal("btn"); }); }
    else if(st.beat===1){ say(sit.who,sit.line,sit.sprite,()=>{ actions.replaceChildren(next("Ваш ход")); reveal("btn"); }); }
    else if(st.beat===2){
      name.textContent="Вы"; setSprite("teacher"); $live.textContent="Как вы ответите?";
      typeInto(line,"Как вы ответите?",()=>{
        const list=[el("p","q","Выберите ход")];
        st.order.forEach(i=>{ const m=sit.moves[i], seen=st.seen.has(i);
          list.push(btn(esc(m.say)+(seen?'<small>вы уже смотрели этот ход</small>':""),seen?"seen":"",()=>{ st.pick=i; st.seen.add(i); st.beat=3; show(); })); });
        actions.replaceChildren(...list); reveal("win");
      });
    }
    else if(st.beat===3){ say("Вы",sit.moves[st.pick].say,"teacher",()=>{ actions.replaceChildren(next()); reveal("btn"); }); }
    else if(st.beat===4){
      const m=sit.moves[st.pick];
      say(sit.who,m.react,sit.sprite,()=>{
        const res=el("div","win result",`<p class="lbl">Что произошло</p><p>${esc(m.result)}</p><p class="lbl">Вопрос себе</p><p>${esc(sit.ask)}</p>`);
        const th=THEORY.find(t=>t.id===sit.theory), all=st.seen.size===sit.moves.length;
        const more=[res];
        if(all) more.push(el("p","reflect","Вы посмотрели все три хода. Какой из них чаще встречается в вашей практике?"));
        more.push(btn(all?"Сыграть ход ещё раз":"Выбрать другой ход",all?"":"primary",()=>{ st.beat=2; show(); }));
        more.push(btn(`<b>Читать в теории</b><small>${esc(th.title)}</small>`,"",()=>go("#/theory/"+th.id)));
        more.push(btn("К ситуациям","ghost",()=>go("#/situations")));
        actions.replaceChildren(...more); reveal("win");
        $live.textContent="Что произошло: "+m.result+" Вопрос себе: "+sit.ask;
      });
    }
  }
  show();
}

/* ============ Маршрутизация ============ */
function route(){
  const [a,b]=location.hash.replace(/^#\/?/,"").split("/");
  if(a==="theory") return b?theoryCard(b):theoryList();
  if(a==="situations") return situationList();
  if(a==="play") return play(b);
  home();
}
addEventListener("hashchange",route); route();
</script>
